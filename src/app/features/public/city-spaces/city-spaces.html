<app-search-bar></app-search-bar>

<section class="city-spaces py-5 container">
  <h2 class="section-title text-center mb-4">
    Trouvez votre espace de coliving idéal dans les plus grandes villes françaises
  </h2>

  <div class="row g-4 justify-content-center">
    @for (city of cities; track $index) {
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="city-card" (click)="openCity(city.name)">
          <img 
            [src]="'assets/images/cities/' + city.name.toLowerCase() + '.jpg'" 
            [alt]="city.name"
          />
          <div class="city-name">{{ city.name }}</div>
        </div>
      </div>
    }
  </div>
</section>
